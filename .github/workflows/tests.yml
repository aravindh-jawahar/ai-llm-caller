name: tests

# Gate every PR, and re-run on main so a bad merge is caught immediately.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      # --locked fails if uv.lock has drifted from pyproject.toml.
      - run: uv sync --locked
      - run: uv run pytest -q
